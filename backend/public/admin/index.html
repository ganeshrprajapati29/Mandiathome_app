<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mandi At Home Admin</title>
<link rel="icon" href="logo.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div id="login" class="login hidden">
  <form class="card login-card" id="loginForm">
    <img src="logo.jpg" alt="" class="login-logo" />
    <h2>Admin Login</h2>
    <p class="muted">Mandi At Home control panel</p>
    <input name="email" type="email" placeholder="Email" required />
    <input name="password" type="password" placeholder="Password" required />
    <button class="btn primary block">Login</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><img src="logo.jpg" alt="" /><div><b>Mandi At Home</b><small>Admin Panel</small></div></div>
    <nav id="nav">
      <a data-page="dashboard">📊 Dashboard</a>
      <a data-page="orders">🧾 Orders</a>
      <a data-page="products">🥕 Products & Prices</a>
      <a data-page="categories">🗂️ Categories</a>
      <a data-page="banners">🖼️ Banners</a>
      <a data-page="coupons">🏷️ Coupons</a>
      <a data-page="users">👥 Customers</a>
      <a data-page="settings">⚙️ Store Settings</a>
    </nav>
    <button class="btn ghost block" id="logout">Logout</button>
  </aside>
  <main class="main">
    <header class="top"><button class="menu" id="menuBtn">☰</button><h1 id="pageTitle">Dashboard</h1></header>
    <section id="page"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box card"><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
