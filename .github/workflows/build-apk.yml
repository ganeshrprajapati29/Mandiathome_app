name: Build Android APK & Play Store bundle

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      api_host:
        description: 'Backend URL baked into the app'
        default: 'http://72.60.41.224:6055'
      build_number:
        description: 'Play Store versionCode (must be higher than the last uploaded one). Empty = 100 + run number'
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_HOST: ${{ github.event.inputs.api_host || 'http://72.60.41.224:6055' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          BN="${{ github.event.inputs.build_number }}"
          [ -z "$BN" ] && BN=$((100 + ${{ github.run_number }}))
          echo "code=$BN" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$BN" >> "$GITHUB_OUTPUT"
          echo "versionName 1.0.$BN, versionCode $BN"

      - name: Set up upload keystore (from GitHub secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mandiathome.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=mandiathome.jks"
          } > android/key.properties
          keytool -list -keystore android/app/mandiathome.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Build Play Store bundle (.aab)
        run: flutter build appbundle --release --build-number=${{ steps.ver.outputs.code }} --build-name=${{ steps.ver.outputs.name }} --dart-define=API_HOST=$API_HOST

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.ver.outputs.code }} --build-name=${{ steps.ver.outputs.name }} --dart-define=API_HOST=$API_HOST

      - name: Check signatures
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:" | head -3
          mkdir -p build/out
          cp build/app/outputs/bundle/release/app-release.aab build/out/MandiAtHome-v${{ steps.ver.outputs.name }}.aab
          cp build/app/outputs/flutter-apk/app-release.apk build/out/MandiAtHome-v${{ steps.ver.outputs.name }}.apk

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/mandiathome.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: MandiAtHome-${{ steps.ver.outputs.name }}
          path: app/build/out/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Mandi At Home v${{ steps.ver.outputs.name }}
          body: |
            Package: com.mandiathome — versionCode ${{ steps.ver.outputs.code }}, versionName ${{ steps.ver.outputs.name }}
            API: ${{ env.API_HOST }}
            • .aab → upload to Google Play Console (signed with the upload key)
            • .apk → install directly on a phone
          files: app/build/out/*
