name: mandiathome
description: "Mandi At Home - fresh fruits & vegetables delivered from the mandi to your home."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ---- App icon:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#F7F7F7"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  remove_alpha_ios: true

# ---- Native splash (shown before Flutter loads, then animated splash takes over):  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F7F7"
  image: assets/images/splash_logo.png
  android_12:
    color: "#F7F7F7"
    image: assets/images/splash_logo.png
